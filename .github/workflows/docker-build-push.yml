name: docker-build-push

# Reusable: build a container image and push it to ECR, tagged with the commit SHA.
# Runs on a native arm64 runner, so no emulation and no extra actions in the org allow list.
on:
  workflow_call:
    inputs:
      ecr_repository:
        description: Repository name in ECR, for example `mdb/commerce-api`.
        type: string
        required: true
      role_arn:
        description: Role to assume for the push.
        type: string
        required: true
      aws_region:
        description: AWS region of the registry.
        type: string
        required: true
      context:
        description: Build context, relative to the repo root.
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path, relative to the repo root.
        type: string
        default: Dockerfile
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
    outputs:
      image:
        description: The pushed image, pinned by digest, for a task definition to use.
        value: ${{ jobs.push.outputs.image }}
      digest:
        description: Digest of the pushed image.
        value: ${{ jobs.push.outputs.digest }}

permissions:
  contents: read

jobs:
  push:
    name: push
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The access key can only assume the role, which may push to this registry and nothing else.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws_region }}
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          role-to-assume: ${{ inputs.role_arn }}
          role-session-name: gha-${{ github.run_id }}-push
          role-duration-seconds: 1800

      - name: build and push
        id: push
        env:
          REPOSITORY: ${{ inputs.ecr_repository }}
          REGION: ${{ inputs.aws_region }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${REGION}.amazonaws.com"
          repository_uri="${registry}/${REPOSITORY}"

          # The registry's tags are immutable, so re-running a commit that was already pushed would fail.
          # Report the image it already has instead; the caller's own build check still runs every time.
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null)" || digest=""

          if [ -n "$digest" ] && [ "$digest" != "None" ]; then
            state="already in the registry"
          else
            aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$registry"
            docker build --provenance=false --file "$DOCKERFILE" --tag "${repository_uri}:${GITHUB_SHA}" "$CONTEXT"
            docker push "${repository_uri}:${GITHUB_SHA}"

            # Read the digest back from the registry, which is what a task definition must pin.
            digest="$(aws ecr describe-images --repository-name "$REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
            state="pushed"
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${repository_uri}@${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Image ${state}"
            echo '```'
            echo "${repository_uri}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

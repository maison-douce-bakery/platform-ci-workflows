name: terraform-static

# Reusable: fmt, validate, optional terraform test, tflint. No cloud credentials.
on:
  workflow_call:
    inputs:
      directories:
        description: Space-separated directories or globs to validate, for example `modules/*/`.
        type: string
        default: "."
      run_tests:
        description: Run `terraform test` in each directory.
        type: boolean
        default: false
      terraform_version:
        description: Terraform version to install.
        type: string
        default: "1.17.1"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        env:
          DIRECTORIES: ${{ inputs.directories }}
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          # Unquoted on purpose: split on spaces and expand globs.
          # shellcheck disable=SC2086
          for dir in $DIRECTORIES; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
            if [ "$RUN_TESTS" = "true" ]; then
              terraform -chdir="$dir" test
            fi
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # Avoids rate limits when downloading plugins
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
